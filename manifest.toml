#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "phpldapadmin"
name = "phpLDAPadmin"
description.en = "Manage OpenLDAP database over the web"
description.fr = "Application web de gestion de la base OpenLDAP"

version = "2.3.0~ynh1"

maintainers = ["aymhce"]

[upstream]
license = "GPL-2.0-or-later"
website = "http://www.phpldapadmin.org"
demo = "https://olddemo.phpldapadmin.org/"
admindoc = "http://www.phpldapadmin.org"
code = "https://github.com/leenooks/phpLDAPadmin"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = true

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

[resources]
    [resources.sources.main]
    url = "https://github.com/leenooks/phpLDAPadmin/archive/refs/tags/2.3.0.tar.gz"
    sha256 = "440c024defcd4d23d3a00733f489a6b959a5f35a48dc37ba8d4c939d0f6c9fca"
    autoupdate.strategy = "latest_github_tag"
    autoupdate.version_regex = "^RELEASE-(.*)$"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"
    main.allowed = "admins"

    [resources.apt]
    packages ='php8.4-ldap, php8.4-xml, php8.4-igbinary, php8.4-msgpack, php8.4-memcached, php8.4-sqlite3'
